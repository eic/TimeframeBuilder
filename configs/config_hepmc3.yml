# Example HepMC3 run configuration. Application transformations are in
# timeframe_builder/hepmc3_transformations.yml.

output_file: merged_hepmc3.hepmc3.tree.root
max_events: 100
timeframe_duration: 2000.0  # nanoseconds
bunch_crossing_period: 10.0
sources:
  - input_files:
      - input.hepmc3.tree.root
    name: signal
    static_number_of_events: false
    mean_event_frequency: .01 #GHz
    use_bunch_crossing: true
    attach_to_beam: false
    generator_status_offset: 0
    keep_weight: true
    
  - input_files:
      - input*.hepmc3.tree.root
    name: background
    skip: 10000000
    static_number_of_events: true
    static_events_per_timeframe: 2
    use_bunch_crossing: true
    generator_status_offset: 1000
    already_merged: false
    repeat_on_eof: true
